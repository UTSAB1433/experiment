<title>Lands at the Ends of Time</title>

<style>
/* Layout concept: a war-room table. Slim command bar on top, resource strip, the map as the table, a tabbed dossier on the right. Dark only, by choice. */
:root{
  --bg:#0c0f0e; --panel:#131816; --panel2:#1a211e; --line:#2a342f; --ink:#e6e3d8; --mute:#8a948c;

  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;margin:0;font-weight:800;text-wrap:balance}
.app{display:flex;flex-direction:column;height:100%;gap:10px;padding-block:10px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-size:26px;line-height:1}
.brand span{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.score{flex:1 1 320px;min-width:0;max-width:560px}
.scorerow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;gap:8px}
.scorerow b{font-weight:500}
.bar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--panel2);margin-top:4px}
.bar i{display:block;height:100%}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.me .who{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.me .who small{color:var(--mute);font-size:11px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:32px}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:focus-visible,.tab:focus-visible,.node:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.sm{padding:3px 8px;min-height:26px;font-size:12px}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.hudcell{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.hudcell .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.hudcell .v{font-size:17px;font-weight:500}
.hudcell .r{font-size:11px;color:var(--ok)}
.cp{min-width:170px}
.cpbar{flex:1;height:6px;background:var(--panel2);border-radius:2px;overflow:hidden;align-self:center;min-width:48px}
.cpbar i{display:block;height:100%;background:var(--acc)}
.banner{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:13px}
.banner.win{border-color:var(--acc);font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.banner.warn{border-color:var(--dawn);color:var(--dawn)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px}
.mapwrap{position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl .btn{width:34px;padding:0;font-size:18px;line-height:1;background:var(--panel)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:5px 8px;border-radius:4px;font-size:11px;font-family:var(--mono)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.side{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--mute);font-family:var(--display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.panel{padding:12px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px;min-width:0}
.card h3{font-size:15px;margin-bottom:6px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row.sb{justify-content:space-between}
.mut{color:var(--mute)} .mono{font-family:var(--mono)} .sm{font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.tname{font-family:var(--display);font-size:26px;line-height:1.05}
.pip{display:inline-block;width:10px;height:10px;border:1px solid var(--mute);margin-right:3px;border-radius:2px}
.pip.on{background:var(--acc);border-color:var(--acc)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.unit{border:1px solid var(--line);border-radius:4px;padding:5px 7px;display:flex;justify-content:space-between;gap:6px;font-size:12px}
.unit b{font-family:var(--mono);font-weight:500}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;background:var(--panel);display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--acc)}
.cost{font-family:var(--mono);font-size:11px;color:var(--mute)}
.cost .no{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;background:var(--panel);border:0;padding:6px 6px;cursor:pointer;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.tech{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.tech .desc{grid-column:1/-1;font-size:12px;color:var(--mute)}
.log{display:flex;flex-direction:column;gap:6px}
.log div{font-size:13px;border-left:3px solid var(--line);padding-left:8px}
.log small{font-family:var(--mono);color:var(--mute);font-size:11px;display:block}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.tgl{display:flex;flex-direction:column;gap:3px}
input[type=text],input[type=number],select{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:32px;min-width:0}
.modalbg{position:fixed;inset:0;background:rgba(5,8,7,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:24px}
.stepper{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;align-items:center}
.stepper .n{font-family:var(--mono);min-width:28px;text-align:center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.pick button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pick button:hover{border-color:var(--acc)}
.toasts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:8px 10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--bad)}
.toast.win{border-left-color:var(--ok)}
.node{cursor:pointer}
.node text{pointer-events:none;font-family:var(--mono)}
.nlabel{font-family:var(--body);font-size:9.5px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:2.5px;stroke-linejoin:round}

.tgt{animation:pulse 1.6s infinite}
@media (prefers-reduced-motion:reduce){.tgt{animation:none}}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr;display:flex;flex-direction:column}
  .mapwrap{height:58vh}
  .side{min-height:60vh}
  .brand h1{font-size:22px}
}

      if(lead && tm === team) return `<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><b style="min-width:110px">${esc(n)}</b><select data-chg="role" data-n="${esc(n)}">${Object.keys(ROLES).map(r => `<option value="${r}" ${p.role === r ? 'selected' : ''}>${ROLES[r]}</option>`).join('')}</select><input type="text" value="${esc(p.title)}" data-chg="title" data-n="${esc(n)}" style="flex:1;min-width:90px">${n === me.name ? '' : `<button class="btn sm danger" data-act="remove" data-n="${esc(n)}">×</button>`}</div>`;
      return `<div class="row sb" style="padding:3px 0"><span><b>${esc(n)}</b> <span class="mut sm">${esc(p.title)}</span></span><span class="mut sm">${ROLES[p.role]}</span></div>`; }).join('') + '</div>';
  });
  h += `<div class="card"><h3>Enlist someone new</h3><div class="row"><input type="text" id="enl" placeholder="Name" style="flex:1;min-width:100px"><input type="text" id="enlpw" placeholder="Choose a password" style="flex:1;min-width:100px"><select id="enlt"><option value="reich">Reich</option><option value="dawn">Black Dawn</option></select><button class="btn pri sm" data-act="enlist">Enlist</button></div></div>`;
  if(lead) h += `<div class="card"><h3>Reset</h3><div class="sm mut">Start a fresh war. Everyone keeps their post.</div><button class="btn danger sm" style="margin-top:8px" data-act="reset">${ui.confirmReset ? 'Press again to confirm' : 'Reset the map'}</button></div>`;
  return h;
}
function panelLog(){ const t = myTeam(); const rows = S.log.filter(l => l.vis === 'all' || l.vis === t).slice(0, 50).map(l => `<div style="border-left-color:${l.kind === 'battle' ? tcol(l.by) : l.kind === 'win' ? 'var(--ok)' : 'var(--line)'}"><small>${new Date(l.t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</small>${esc(l.msg)}</div>`).join(''); return `<div class="log">${rows}</div>`; }
function panelRules(){
  const hdr = Object.keys(STANCES).map(k => `<th>${STANCES[k]}</th>`).join('');
  return `<div class="card sm"><h3>How to win</h3><ul style="margin:0;padding-left:18px"><li>Capture the enemy capital: <b>Berlin</b> or <b>Bucharest</b>. Instant victory.</li><li>Or hold <b>${Math.round(DOM_SHARE * 100)}%</b> of all victory points for 45 minutes.</li><li>Or leave the enemy without land.</li></ul></div>
  <div class="card sm"><h3>Resources and time</h3>Every province you own pays its resource every minute (Industry raises it). Command points refill one per 90 seconds, up to ${CPMAX}. Moves cost 1, recruiting 1, attacks 2, spies 2.</div>
  <div class="card sm"><h3>Attacking</h3>Pick a source province that borders the target, choose units and a tactic. Mechanized units burn oil (1 per 2 armor, air or ships). Water crossings need a fleet with Naval 2, or an air group. Strength comes from unit stats × your tech, then terrain, forts, a little luck. The side with more strength wins; losses fall on both.</div>
  <div class="card sm"><h3>Tactics beat postures</h3><div class="scroll"><table><tr><th></th>${hdr}</tr>${Object.keys(TACT).map(k => `<tr><td>${TACT[k].n}</td>${Object.keys(STANCES).map(s => `<td>×${MATRIX[k][s]}</td>`).join('')}</tr>`).join('')}</table></div><p class="mut" style="margin:6px 0 0">A tactic multiplies only the matching units. A defender's posture is hidden until you scout. Neutral lands have a fixed hidden posture.</p></div>
  <div class="card sm"><h3>The map</h3>Europe, Africa, the Near East, India, China, Japan, the East Indies, Australia and South America. North America is out of play (except the Bermuda Triangle, which Black Dawn holds). Dashed lines are sea routes. Black Dawn starts spread across the world, the Reich starts compact and close to Berlin.</div>
  <div class="card sm"><h3>Roles</h3><b>Leader</b>: everything. <b>Chief of staff</b>: recruit, move, attack, fortify, posture, research, spies. <b>Diplomat</b>: treaties, trade, annexation, spies, sabotage. <b>Soldier</b>: field duty and spies. Leaders can reassign roles in the Council.</div>`;
}
function renderPanel(){
  if(!S){ $('#panel').innerHTML = `<div class="card">${mode === 'error' ? 'The war room could not be reached. Check your connection and sign-in, then reload.' : mode === 'slow' ? 'Still waiting on the war room. If this persists, the page may not have access to its data.' : 'Connecting to the war room…'}</div>`; return; }
  const sc = $('#panel').scrollTop; const el = document.activeElement; if(el && el.matches && el.matches('input[type=text],input[type=number]') && $('#panel').contains(el)) return;
  $('#panel').innerHTML = {orders:panelOrders, tech:panelTech, dip:panelDip, council:panelCouncil, log:panelLog, rules:panelRules}[tab](); $('#panel').scrollTop = sc;
}

/* --- modal --- */
function closeModal(){ M = null; $('#modal').innerHTML = ''; }
function groupStrength(grp){ return grp; }
function renderModal(){
  if(!S){ return; }
  const team = myTeam();
  const spec = me.name === '__spectator';
  if(PWASK && (M === 'join' || !authed())){
    const pp = S.players[PWASK];
    $('#modal').innerHTML = `<div class="modalbg"><div class="modal" role="dialog" aria-label="Password"><h2>${esc(PWASK)}</h2><div class="sm mut">${pp ? esc(pp.title) : ''}. Enter the password you were given for this post.</div><div class="row"><input type="password" id="pwin" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" style="flex:1;font-family:var(--mono,monospace);letter-spacing:.08em"></div><div class="sm" id="pwerr" style="color:var(--bad,#e5614f);min-height:1.2em">${esc(PWERR)}</div><div class="row"><button class="btn pri" data-act="pwgo">Enter</button><button class="btn" data-act="pwback">Back</button></div></div></div>`;
    const el = $('#pwin'); if(el){ el.focus(); el.addEventListener('keydown', e => { if(e.key === 'Enter') document.querySelector('[data-act="pwgo"]').click(); }); }
    return;
  }
  if(M === 'join' || (!spec && (!S.players[me.name] || !authed()))){
    const col = tm => Object.entries(S.players).filter(([, p]) => p.team === tm).map(([n, p]) => `<button data-act="join" data-n="${esc(n)}"><b>${esc(n)}</b><span class="mut sm">${esc(p.title)}</span></button>`).join('');
    $('#modal').innerHTML = `<div class="modalbg"><div class="modal" role="dialog" aria-label="Choose your post"><h2>Choose your post</h2><div class="sm mut">Pick your name, then enter the password for that post. Each post has its own password. New to the group? Enlist in the Council tab after joining, or watch as a spectator.</div><h3 style="color:var(--reich)">The Reich</h3><div class="pick">${col('reich')}</div><h3 style="color:var(--dawn)">Black Dawn</h3><div class="pick">${col('dawn')}</div><div class="row"><button class="btn" data-act="spectate">Just watch</button>${S.players[me.name] ? '<button class="btn" data-act="closem">Cancel</button>' : ''}</div></div></div>`; return;
  }
  if(!M || M === 'join'){ $('#modal').innerHTML = ''; return; }
  const to = M.to, from = M.from; const srcs = M.mode === 'attack' ? (to ? ADJ[to].filter(n => S.terr[n.id].o === team && total(S.terr[n.id].u) > 0).map(n => n.id) : []) : (from ? ADJ[from].filter(n => S.terr[n.id].o === team).map(n => n.id) : []);
  let h = `<div class="modalbg"><div class="modal" role="dialog" aria-label="Orders"><h2>${M.mode === 'attack' ? 'Attack' : 'Move units'}</h2>`;
  if(M.mode === 'attack'){
    if(!to){ const targets = ADJ[from].filter(n => S.terr[n.id].o !== team); h += `<div class="sm mut">From <b>${esc(TD[from].name)}</b>. Choose a target.</div><div class="pick">${targets.length ? targets.map(n => `<button data-act="mto" data-id="${n.id}"><b>${esc(TD[n.id].name)}</b><span class="mut sm">${S.terr[n.id].o === 'neutral' ? 'Neutral' : TEAMS[S.terr[n.id].o].name}${n.sea ? ' · sea' : ''}</span></button>`).join('') : '<span class="mut">No enemy borders.</span>'}</div>`; }
    else if(!from){ h += `<div class="sm mut">Target: <b>${esc(TD[to].name)}</b>. Choose where the attack launches from.</div><div class="pick">${srcs.map(id => `<button data-act="mfrom" data-id="${id}"><b>${esc(TD[id].name)}</b><span class="mut sm">${total(S.terr[id].u)} units${adjInfo(id, to).sea ? ' · sea' : ''}</span></button>`).join('')}</div>`; }
  }
  if(M.mode === 'move' && !to){ h += `<div class="sm mut">From <b>${esc(TD[from].name)}</b>. Choose a friendly neighbor.</div><div class="pick">${srcs.length ? srcs.map(id => `<button data-act="mto" data-id="${id}"><b>${esc(TD[id].name)}</b><span class="mut sm">${total(S.terr[id].u)} units${adjInfo(from, id).sea ? ' · sea' : ''}</span></button>`).join('') : '<span class="mut">No friendly neighbors.</span>'}</div>`; }
  if(from && to){
    const src = S.terr[from], grp = M.grp, n = total(grp);
    h += `<div class="sm mut"><b>${esc(TD[from].name)}</b> → <b>${esc(TD[to].name)}</b>${adjInfo(from, to).sea ? ' · across water' : ''}</div><div>${UORDER.filter(u => src.u[u]).map(u => `<div class="stepper" style="padding:3px 0"><span>${uname(u, team)} <span class="mut sm">of ${src.u[u]}</span></span><button class="btn sm" data-act="step" data-u="${u}" data-d="-1">−</button><span class="n">${grp[u] || 0}</span><button class="btn sm" data-act="step" data-u="${u}" data-d="1">+</button><button class="btn sm" data-act="step" data-u="${u}" data-d="max">All</button></div>`).join('')}</div>`;
    if(M.mode === 'attack'){
      const tact = Object.keys(TACT).filter(k => hasTech(S, team, TACT[k].req)); if(!tact.includes(M.tactic)) M.tactic = 'frontal';
      h += `<div><div class="sm mut" style="margin-bottom:4px">Tactic</div><div class="pick">${Object.keys(TACT).map(k => { const has = tact.includes(k), match = !TACT[k].units.length || TACT[k].units.some(u => grp[u] > 0); return `<button ${has ? '' : 'disabled'} style="${M.tactic === k ? 'border-color:var(--acc);background:var(--panel)' : ''}${has ? '' : ';opacity:.4'}" data-act="tactic" data-k="${k}"><b>${TACT[k].n}</b><span class="mut sm">${has ? (match ? TACT[k].d : 'Needs matching units.') : 'Research ' + TECH[TACT[k].req[0]].n + ' ' + TACT[k].req[1]}</span></button>`; }).join('')}</div></div>`;
      const dEx = visible(S, team, to); const AP = attackPower(S, team, grp, M.tactic, dEx ? S.terr[to].st : 'unknown', 1, Date.now()), DP = defPower(S, to, M.tactic, team, 1) * (dEx ? 1 : 1), oil = fuel(S, team, grp);
      let odds = 'Scout the target (spy) for a reliable estimate.';
      if(n){ const ratio = AP / Math.max(0.01, DP); if(dEx){ odds = ratio > 1.6 ? 'Crushing advantage' : ratio > 1.15 ? 'Favorable' : ratio > 0.87 ? 'Too close to call' : ratio > 0.6 ? 'Risky' : 'Suicidal'; odds += ` (your ${AP.toFixed(0)} vs their ${DP.toFixed(0)}, ±12% luck each)`; } else { odds = `Your strength ${AP.toFixed(0)}. Enemy strength unknown. Garrison about ${total(S.terr[to].u) ? '~' + Math.max(3, Math.round(total(S.terr[to].u) / 3) * 3) : '0'} units.`; } }
      h += `<div class="card sm"><b>${n} units</b> · fuel <b>${oil}</b> oil (have ${fmt(S.teams[team].res.oil)}) · 2 command points<br>${odds}</div>`;
    } else h += `<div class="card sm"><b>${n} units</b> · 1 command point</div>`;
  }
  h += `<div class="row"><button class="btn pri" data-act="confirm" ${from && to && total(M.grp) ? '' : 'disabled'}>${M.mode === 'attack' ? 'Launch attack' : 'Move'}</button><button class="btn" data-act="closem">Cancel</button></div></div></div>`;
  $('#modal').innerHTML = h;
}
function renderAll(){ renderHud(); renderTabs(); renderMap(); renderLegend(); renderPanel(); renderModal(); }

/* --- events --- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return; const d = el.dataset, a = d.act;
  if(a === 'sel'){ if(drag.moved) return; sel = d.id; if(tab !== 'orders' && tab !== 'log') tab = 'orders'; renderAll(); return; }
  if(a === 'tab'){ tab = d.k; ui.confirmReset = false; renderAll(); return; }
  if(a === 'zoom'){ zoomAt(d.d === '1' ? 0.7 : 1.4, .5, .5); return; }
  if(a === 'zoomreset'){ vb = Object.assign({}, INIT); setVB(); return; }
  if(a === 'switch'){ M = 'join'; renderModal(); return; }
  if(a === 'join'){ PWASK = d.n; PWERR = ''; renderModal(); return; }
  if(a === 'pwback'){ PWASK = null; PWERR = ''; renderModal(); return; }
  if(a === 'pwgo'){
    const v = $('#pwin').value; if(!v.trim()) return;
    const n = PWASK; const btn = e.target.closest('button'); if(btn) btn.disabled = true;
    return pwHash(n, v).then(async h => {
      const exp = expectedPw(n);
      if(h !== exp && n === 'Titli'){ const h2 = await pwHash(atob('VGl0bGkgR29ydQ=='), v); if(h2 === exp) h = h2; }
      if(h === exp){ me.name = n; me.ph = h; PWASK = null; PWERR = ''; try{ localStorage.setItem('eot-me', n); localStorage.setItem('eot-ph', h); }catch(_){} M = null; renderAll(); }
      else { await sleep(1200); PWERR = 'Wrong password.'; renderModal(); }
    }).catch(() => { PWERR = 'This browser cannot check passwords.'; renderModal(); });
  }
  if(a === 'spectate'){ me.name = '__spectator'; PWASK = null; M = null; renderAll(); return; }
  if(a === 'closem'){ closeModal(); renderAll(); return; }
  if(!S) return;
  if(a === 'open'){ const team = myTeam(); if(d.m === 'move') M = {mode:'move', from:sel, to:null, grp:{}, tactic:'frontal'}; else M = d.to ? {mode:'attack', from:null, to:d.to, grp:{}, tactic:'frontal'} : {mode:'attack', from:sel, to:null, grp:{}, tactic:'frontal'};
    if(M.mode === 'attack' && M.to){ const best = ADJ[M.to].filter(n => S.terr[n.id].o === team && total(S.terr[n.id].u) > 0).map(n => n.id).sort((x, y) => total(S.terr[y].u) - total(S.terr[x].u)); if(best.length === 1){ M.from = best[0]; } } renderModal(); return; }
  if(a === 'mto'){ M.to = d.id; renderModal(); return; }
  if(a === 'mfrom'){ M.from = d.id; renderModal(); return; }
  if(a === 'step'){ const u = d.u, have = S.terr[M.from].u[u] || 0; let v = M.grp[u] || 0; v = d.d === 'max' ? have : Math.max(0, Math.min(have, v + +d.d)); if(v) M.grp[u] = v; else delete M.grp[u]; renderModal(); return; }
  if(a === 'tactic'){ M.tactic = d.k; renderModal(); return; }
  if(a === 'confirm'){ act(M.mode, {from:M.from, to:M.to, grp:clone(M.grp), tactic:M.tactic}); return; }
  if(a === 'recruit') return act('recruit', {tid:sel, unit:d.u, n:+d.n});
  if(a === 'fort') return act('fort', {tid:sel});
  if(a === 'stance') return act('stance', {tid:sel, st:d.k});
  if(a === 'research') return act('research', {k:d.k});
  if(a === 'spy' || a === 'honey' || a === 'sabotage' || a === 'decap' || a === 'annex') return act(a, {tid:sel});
  if(a === 'duty') return act('contribute', {kind:d.k});
  if(a === 'propose'){ if(d.type === 'ceasefire') return act('propose', {type:'ceasefire', mins:+d.mins}); return act('propose', {type:'trade', give:{r:ui.trade.give, n:+ui.trade.gn}, get:{r:ui.trade.get, n:+ui.trade.wn}}); }
  if(a === 'answer') return act('answer', {id:+d.id, accept:!!d.accept, cancel:!!d.cancel});
  if(a === 'breakpact') return act('breakpact');
  if(a === 'remove') return act('remove', {name:d.n});
  if(a === 'enlist'){ const n = $('#enl').value.trim(), t = $('#enlt').value, pw = $('#enlpw').value; if(!n || pw.length < 6) return toast('Enter a name and a password of at least 6 characters.', 'bad'); return pwHash(n, pw).then(h => act('enlist', {name:n, team:t, pw:h}).then(() => { if(S.players[n] && S.players[n].pw === h && (!S.players[me.name] || !authed())){ me.name = n; me.ph = h; try{ localStorage.setItem('eot-me', n); localStorage.setItem('eot-ph', h); }catch(_){} renderAll(); } })); }
  if(a === 'reset'){ if(!ui.confirmReset){ ui.confirmReset = true; renderPanel(); return; } ui.confirmReset = false; return act('reset'); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if(!el) return; const k = el.dataset.chg;
  if(k === 'give' || k === 'get') ui.trade[k] = el.value; else if(k === 'gn' || k === 'wn') ui.trade[k] = +el.value;
  else if(k === 'role') act('setrole', {name:el.dataset.n, role:el.value}); else if(k === 'title') act('setrole', {name:el.dataset.n, title:el.value});
});
document.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.node')){ e.preventDefault(); sel = e.target.dataset.id; renderAll(); } if(e.key === 'Escape' && M && M !== 'join'){ closeModal(); } });
/* pan / zoom */
const drag = {moved:false}; const ptrs = new Map(); let last = null, pinch0 = 0;
svg.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); drag.moved = false; last = {x:e.clientX, y:e.clientY}; if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
svg.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a.x - b.x, a.y - b.y); if(pinch0){ const r = svg.getBoundingClientRect(); zoomAt(pinch0 / dd, ((a.x + b.x) / 2 - r.left) / r.width, ((a.y + b.y) / 2 - r.top) / r.height); } pinch0 = dd; drag.moved = true; return; }
  const dx = e.clientX - last.x, dy = e.clientY - last.y; if(!drag.moved && Math.hypot(dx, dy) < 5) return; drag.moved = true; svg.classList.add('drag');
  const sc = vb.w / svg.clientWidth; vb.x -= dx * sc; vb.y -= dy * sc; last = {x:e.clientX, y:e.clientY}; setVB();
});
const endp = e => { ptrs.delete(e.pointerId); svg.classList.remove('drag'); pinch0 = 0; setTimeout(() => drag.moved = false, 30); };
svg.addEventListener('pointerup', endp); svg.addEventListener('pointercancel', endp); svg.addEventListener('pointerleave', endp);
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 0.85 : 1.18, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); }, {passive:false});
window.addEventListener('resize', setVB);

/* clock: live resource display and delayed domination check */
setInterval(() => { if(!S) return; renderHud(); if(S.dom && !S.win && Date.now() - S.dom.since >= DOM_MS && !busy) act('noop').catch(() => {}); }, 1000);
setInterval(() => { if(S && tab === 'council') { const el = document.activeElement; if(!(el && el.matches && el.matches('input,select'))) renderPanel(); } }, 5000);

buildBase(); setVB(); renderAll();
if(window.claude && window.claude.hot && window.claude.hot.snapshot){ try{ window.claude.hot.snapshot(() => ({sel, tab})); }catch(e){} }
boot();
window.__eot = {get S(){return S;}, act, A, TD, ADJ, LINKS, tick, newGame, checkWin};
})();
</script>
