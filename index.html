<style>
/* Layout concept: a war-room table. Slim command bar on top, resource strip, the map as the table, a tabbed dossier on the right. Dark only, by choice. */
:root{
  --bg:#0c0f0e; --panel:#131816; --panel2:#1a211e; --line:#2a342f; --ink:#e6e3d8; --mute:#8a948c;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.score{flex:1 1 320px;min-width:0;max-width:560px}

.unit{border:1px solid var(--line);border-radius:4px;padding:5px 7px;display:flex;justify-content:space-between;gap:6px;font-size:12px}

.divhdr{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:6px 0 4px}
.pwr{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--panel);border:1px solid var(--line);color:var(--acc);margin-left:4px;vertical-align:middle}

.tech{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}

.research-nav,.mastery-dossier,.mastery-card{display:grid;gap:8px}
.research-kicker,.mastery-rank{font:11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.mastery-dossier{border-top:2px solid var(--acc)}
.mastery-dossier label{display:grid;gap:4px}.mastery-dossier select{width:100%}
.mastery-card h3{color:var(--ink);margin:0;font-size:18px}.mastery-card .pip{width:8px;height:8px}
.mastery-gain{font-family:var(--mono);font-size:12px}.mastery-gain b{color:var(--ink);color:color-mix(in srgb,var(--acc) 65%,var(--ink))}

.front-hero,.power-list{--front:#9ac6c6}

.front-entry,.power-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.front-entry{background:#1d2a28;border-left:2px solid #9ac6c6;padding:8px 10px}.front-entry small{display:block;color:var(--mute)}

#entry{width:min(100%,46rem);margin:clamp(1rem,7vh,5rem) auto auto;padding:clamp(18px,4vw,36px);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--dawn);border-radius:5px;overflow:auto}
#entry h2{font-size:clamp(1.65rem,4vw,2.4rem);line-height:1.1}#entry>p{max-width:62ch}#entry h3{font-size:1.1rem}
.eyebrow{font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dawn);margin:0 0 12px}

#entry label{display:grid;gap:4px;font-size:13px;color:var(--mute)}#entry input{min-width:0;width:100%;margin-bottom:10px;color:var(--ink);min-height:40px}#entry input::placeholder{color:var(--mute);opacity:1}#entry .btn{min-height:40px;white-space:normal}
#entry form label:first-of-type{margin-top:12px}.account-form{display:grid;gap:3px;max-width:28rem;margin:18px 0}.account-form .row{margin:10px 0}.desk-post{padding:6px 0}.desk-post button{display:block;margin:6px 0}#account-error{color:var(--bad)}

.council-roster h3{color:var(--ink);color:color-mix(in srgb,var(--post-color) 80%,var(--ink))}
.council-name{min-width:110px;overflow-wrap:anywhere}.council-name small{display:block;color:var(--mute)}
.log{display:flex;flex-direction:column;gap:6px}
.log > article{font-size:13px;border-left:3px solid var(--line);padding-left:8px}
.log > p{margin:0 0 4px}
.log-place{font:inherit;min-height:24px;padding:0 2px;border:0;background:transparent;color:#b2dcdc;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.log-place:hover{color:#fff}.log-place:focus-visible,.log-sites summary:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.log-sites{margin-top:4px}.log-sites summary{cursor:pointer;color:var(--ink);padding:5px 0}.log-sites p,.log-sites .chips{margin:4px 0}.log-sites .log-place{min-height:30px}

<script>
(() => {
'use strict';
/* ============================ DATA ============================ */

  if(!ex) return `<div class="mut sm">Garrison about <b class="mono">${n ? '~' + Math.max(3, Math.round(n / 3) * 3) : '0'}</b> units. Composition, fort and stance unknown. ${t.o==='neutral'?'Scout this province to reveal the garrison.':'Send a spy or research Intelligence 3.'}</div>`;
  const own = t.o === 'neutral' ? 'reich' : t.o;
  const list = divsFor(own);
  const f = list.includes(ui.gdiv) ? ui.gdiv : 'all';
  const present = UORDER.filter(u => t.u[u]);
  if(!present.length) return '<div class="mut sm">Empty.</div>';
  const groups = list.filter(d => d !== 'all' && (f === 'all' || f === d)).map(d => {
    const items = present.filter(u => UNITS[u] && UNITS[u].div === d).map(u => `<div class="unit"><span>${uname(u, t.o)}</span><b>${t.u[u]}</b></div>`).join('');

    return items ? `<div class="divhdr">${DIVS[d]} Division${subLabel}</div><div class="units">${items}</div>` : '';
  }).join('');
  return divBarHtml('gdiv', f, own) + (groups || '<div class="mut sm">No units in this division here.</div>');
}

    const saltName = S.players[n].pw === DHRUV_VERIFIER ? 'Dhruv' : n;
    // Legacy posts are checked with the folded rule they were created with; only a
    // v8 campaign keeps the password exactly as typed (case and spaces significant).
    return pwHash(saltName,v,campaignRoom(S)).then(async h => {
      if(!current()) return;
      if(h === exp){ frontWatch?.depart(); me.name = n; me.ph = h; PWASK = null; try{ localStorage.setItem('eot-me',n); localStorage.setItem('eot-ph',h); }catch(_){} M = null; NET.announce(); renderAll(); }
      else { await sleep(1200); report('Wrong password.'); }
    }).catch(() => report('This browser cannot check passwords.'))
      .finally(() => { if(current()){ btn.disabled = false; loginAttempt = null; } });
  }
  if(a === 'spectate' && !campaignRoom(S)){ frontWatch?.depart(); me.name = '__spectator'; me.ph = null; try{ localStorage.setItem('eot-me', me.name); localStorage.removeItem('eot-ph'); }catch(_){} PWASK = null; M = null; NET.announce(); renderAll(); return; }
  if(a === 'closem'){ closeModal(); renderAll(); return; }
  if(!S) return;
  if(a === 'open' && (d.m === 'attack' || d.m === 'move')){
    const to = d.m === 'attack' ? d.to || null : null;
    if(!provinceId(to || sel)) return;
    M = {mode:d.m, from:to ? null : sel, to, grp:{}, tactic:'frontal'};
    if(to){
      const sources = attackRoutes(S,myTeam(),to);
      if(sources.length === 1) M.from = sources[0].id;
    }
    renderModal(); return;
  }
  if(a === 'mto' && M?.mode === 'move' && provinceId(d.id)){ M.to = d.id; renderModal(); return; }
  if(a === 'step' && M?.from && knownUnit(d.u)){ const u = d.u, have = S.terr[M.from].u[u] || 0; let v = M.grp[u] || 0; v = d.d === 'max' ? have : Math.max(0, Math.min(have, v + +d.d)); if(v) M.grp[u] = v; else delete M.grp[u]; renderModal(); return; }
  if(a === 'tactic' && M?.mode === 'attack' && Object.hasOwn(TACT,d.k)){ M.tactic = d.k; renderModal(); return; }
  if(a === 'confirm' && M?.from && M.to) return act(M.mode, {from:M.from, to:M.to, grp:clone(M.grp), tactic:M.tactic});
  if(a === 'recruit') return act('recruit', {tid:sel, unit:d.u, n:+d.n, quote:displayedQuote(d)});
  if(a === 'fort') return act('fort', {tid:sel, rank:+d.rank, quote:displayedQuote(d)});
  if(a === 'stance') return act('stance', {tid:sel, st:d.k});
  if(a === 'research') return act('research', {k:d.k, rank:+d.rank, quote:displayedQuote(d)});
  if(a === 'mastery') return act('mastery', {unit:d.u, skill:d.skill, rank:Number(d.rank), quote:displayedQuote(d)});
  if(a === 'annex') return act(a, {tid:sel, quote:displayedQuote(d)});
  if(a === 'spy' || a === 'honey' || a === 'sabotage' || a === 'decap') return act(a, {tid:sel});
  if(a === 'duty') return act('contribute', {kind:d.k});
  if(a === 'propose'){ if(d.type === 'ceasefire') return act('propose', {type:'ceasefire', mins:+d.mins}); return act('propose', tradeDraft()); }
  if(a === 'answer') return act('answer', {id:+d.id, accept:!!d.accept, cancel:!!d.cancel});
  if(a === 'breakpact') return act('breakpact',{until:Number(d.until),quote:displayedQuote(d)});
  if(a === 'attackseat') return act('setrole', {name:d.n,attackSeat:d.grant === '1'});
  if(a === 'remove'){
    // Removing a post cannot be undone, so it takes two presses like a reset.
    const key = 'remove:' + d.n;
    if(ui.confirmRemove !== key){ ui.confirmRemove = key; renderPanel(); toast('Press × again to remove ' + d.n + ' from this room.', 'bad'); return; }
    ui.confirmRemove = null; return act('remove', {name:d.n});
  }
  if(a === 'enlist' && !campaignRoom(S)){
    const popup=M==='legacy-signup', n = $(popup?'#legacy-name':'#enl').value.trim(), t = $(popup?'#legacy-team':'#enlt').value, pw = $(popup?'#legacy-password':'#enlpw').value;
    if(!n || n.length > 30 || pw.length < 6) return toast('Enter a name (up to 30 characters) and a password of at least 6 characters.', 'bad');
    const store = db, epoch = authorityEpoch, created = S.created, who = {...me};
    return pwHash(n,pw).then(async h => {
      if(store !== db || epoch !== authorityEpoch || !liveBoard() || created !== S.created || who.name !== me.name || who.ph !== me.ph || (popup && M!=='legacy-signup')) return;
      await act('enlist',{name:n,team:t,pw:h});
      if(store !== db || epoch !== authorityEpoch || !liveBoard() || S.players[n]?.pw !== h || who.name !== me.name || who.ph !== me.ph) return;
      if(!popup && $('#enl')?.value.trim()===n && $('#enlpw')?.value===pw){ $('#enl').value=$('#enlpw').value=''; }
      if(S.players[me.name] && authed()) return;
      if(popup) closeModal(); me.name = n; me.ph = h; try{ localStorage.setItem('eot-me',n); localStorage.setItem('eot-ph',h); }catch(_){} NET.announce(); renderAll();
    }).catch(() => toast('Could not complete enlistment. Check the live roster before retrying.','bad'));
  }
  if(a === 'reset'){
    if(ui.confirmReset !== S){ ui.confirmReset = S; renderPanel(); return; }
    ui.confirmReset = null; return act('reset', {rev:S.rev, origin:S.origin, created:S.created});
  }
});
document.addEventListener('input', e => {
  if(['home-code','home-room','roomin'].includes(e.target?.id)){ e.target.removeAttribute('aria-invalid'); const note=$('#'+e.target.id+'-error'); if(note) note.textContent=''; }
  if(['gn','wn'].includes(e.target?.dataset?.chg) && S){ui.trade[e.target.dataset.chg]=e.target.value; refreshTrade(projectedEconomy());}
  if(e.target && e.target.id === 'natq'){
    ui.natQ = e.target.value;
    const dir = $('#natdir');
    if(dir){
      const tmp = document.createElement('div');
      tmp.innerHTML = nationDirectory();
      const newChips = tmp.querySelector('.chips'), oldChips = dir.querySelector('.chips');
      const newH = tmp.querySelector('h3'), oldH = dir.querySelector('h3');
      if(newChips && oldChips) oldChips.innerHTML = newChips.innerHTML;
      if(newH && oldH) oldH.innerHTML = newH.innerHTML;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if(!el) return; const k = el.dataset.chg;
  if(k === 'masteryunit' && unitsFor(myTeam() || 'reich').includes(el.value)){
    ui.masteryUnit = el.value; renderPanel(); $('#mastery-unit').focus({preventScroll:true}); return;
  }
  if(k === 'attackplace' && S && M?.mode === 'attack' && (!M.to || !M.from)){
    if(attackRoutes(S,myTeam(),M.from || M.to).some(n => n.id === el.value)){
      if(!M.to) M.to = el.value; else M.from = el.value;
    }
    renderModal(); return;
  }
  if(['give','get','gn','wn'].includes(k) && S){ui.trade[k] = el.value; refreshTrade(projectedEconomy());}
  else if(k === 'role') act('setrole', {name:el.dataset.n, role:el.value}); else if(k === 'title') act('setrole', {name:el.dataset.n, title:el.value});
});
const narrowBoard=()=>window.matchMedia?.('(max-width:900px)').matches;
function showMap(){
  (sel && $(`#map .node[data-id="${sel}"]`) || svg).focus({preventScroll:true});
  svg.scrollIntoView?.({block:'center',inline:'nearest'});
}
function showProvince(){
  const title=$('#province-name'); title?.focus({preventScroll:true});
  if(narrowBoard()) title?.scrollIntoView?.({block:'start'});
}
function selectTerritory(id){
  if(!provinceId(id) || !S?.terr[id]) return;
  if(sel !== id) ui.recruitAt = null;
  sel = id;
  if(tab !== 'log'){ tab = 'orders'; $('#panel').scrollTop = 0; }
  renderAll();
}
document.addEventListener('keydown', e => {
  if(modalKey){
    if(e.key === 'Tab'){
      const root = $('#modal'), items = [...root.querySelectorAll(controlsSelector)].filter(el => el.tabIndex >= 0 && !el.disabled && el.getClientRects().length);
      const i = items.indexOf(document.activeElement);
      if(i < 0 || (e.shiftKey ? i === 0 : i === items.length-1)){
        e.preventDefault(); (e.shiftKey ? items.at(-1) : items[0])?.focus();
      }
    } else if(e.key === 'Escape'){
      e.preventDefault();
      if(PWASK){ PWASK = null; renderModal(); }
      else if(M && (M !== 'join' || authed())){ closeModal(); renderAll(); }
    } else if(e.key === 'Enter' && e.target.id === 'pwin'){ e.preventDefault(); $('[data-act="pwgo"]').click(); }
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.node')){
    e.preventDefault(); selectTerritory(e.target.dataset.id); svg.querySelector(`.node[data-id="${sel}"]`)?.focus();
  }
});
/* pan / zoom */
const drag = {moved:false}; const ptrs = new Map(); let last = null, pinch0 = 0;
svg.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); drag.moved = ptrs.size>1; last = {x:e.clientX, y:e.clientY}; if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
svg.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a.x - b.x, a.y - b.y); if(pinch0 && dd>0){ const r = svg.getBoundingClientRect(); zoomAt(pinch0 / dd, ((a.x + b.x) / 2 - r.left) / r.width, ((a.y + b.y) / 2 - r.top) / r.height); } pinch0 = dd; drag.moved = true; return; }
  const dx = e.clientX - last.x, dy = e.clientY - last.y; if(!drag.moved && Math.hypot(dx, dy) < 5) return; drag.moved = true; svg.classList.add('drag');
  if(ui.curReg){ ui.curReg = ''; renderMapnav(); }
  const [sw,sh]=mapSize(), sc=Math.max(vb.w/sw,vb.h/sh); vb.x -= dx * sc; vb.y -= dy * sc; last = {x:e.clientX, y:e.clientY}; setVB();
});
const endp = e => {
  if(!ptrs.delete(e.pointerId)) return;
  // Re-anchor to the remaining finger instead of applying the distance between
  // fingers as the next pan. Only the next pointerdown starts a fresh tap.
  last=ptrs.values().next().value || null; pinch0=0;
  if(!last) svg.classList.remove('drag');
};
svg.addEventListener('pointerup', endp); svg.addEventListener('pointercancel', endp); svg.addEventListener('pointerleave', endp);
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 0.85 : 1.18, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); }, {passive:false});
window.addEventListener('resize', resizeMap);

/* Presence is ephemeral: the simulation clock is never part of tick() or a HUD projection. */
for(const event of ['pointerdown','pointermove','keydown','wheel','click','input']) document.addEventListener(event,noteInput,{capture:true,passive:true});
window.addEventListener('pagehide', () => { pageAway = true; checkIdle(); });
let networkOffline = typeof navigator !== 'undefined' && navigator.onLine === false;
function showOffline(){ pauseRoom('local'); NET.status = 'off'; NET.transport = 'Device offline'; renderAll(); }
function verifyOnReturn(){ if(!badAddress){ if(networkOffline) showOffline(); else NET.reconnect?.(); } }
window.addEventListener('storage',e => {
  if(e.key===SESSION_KEY || e.key===null){frontWatch?.depart(); restoreProfile(); return;}
  if(cacheKey && e.key === 'eot-live-state:'+cacheKey && e.newValue){
    refreshBackup();
    if(backup && (!confirmed || backup.rev > confirmed.rev || divergent(confirmed,backup))){
      // Don't tear down a healthy socket just before its copy of the same packet arrives.
      pauseRoom('waiting'); waitReason = `Another tab has revision ${backup.rev}. Waiting for this source to confirm it.`; renderAll();
    }
  }
});
window.addEventListener('offline',() => { networkOffline = true; if(!badAddress) showOffline(); });
window.addEventListener('online',() => { networkOffline = false; verifyOnReturn(); });
window.addEventListener('pageshow', e => { if(pageAway || e.persisted){ pageAway = false; noteInput(); verifyOnReturn(); } });
let hiddenAt = null;
document.addEventListener('visibilitychange',() => {
  if(document.hidden) hiddenAt = Date.now();
  else if(hiddenAt !== null){ const slept = Date.now()-hiddenAt; hiddenAt = null; if(slept >= SIGNAL_LIFE) verifyOnReturn(); }
});
setInterval(() => frontWatch?.poll(), MUSTER_MS);
/* clock: live resource display and delayed domination check */
setInterval(() => {
  checkIdle(); if(!S) return;
  // Expired scouting or a truce changes the visible board without a new save.
  if(Date.now()>=nextIntelExpiry || displayedTruce !== !!ceasefire(S,Date.now())) renderAll(); else renderHud();
  if(deferredPanel && liveBoard() && !M && !document.activeElement?.matches?.('input,select')) renderPanel();
  updateFrontClock();
  if(mode === 'live' && [POSTS_V,ROOM_V].includes(confirmed?.v) && (!campaignRoom(S) || authed()) && S.dom && !S.win && Date.now() - S.dom.since >= DOM_MS && !busy) act('noop').catch(() => {});
}, 1000);


buildBase(); setVB(); renderMapnav();
if(window.claude && window.claude.hot && window.claude.hot.snapshot){ try{ window.claude.hot.snapshot(() => ({sel, tab})); }catch(e){} }
boot(); if(readPref(SESSION_KEY)) restoreProfile();
window.__eot = {get S(){return S;}, act, A, TD, ADJ, LINKS, tick, newGame, checkWin, recruitCost, researchCost, masteryCost, pwHash, normPw, exactPw};
})();
</script>
