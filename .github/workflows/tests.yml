name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    name: Core suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: No dependency install needed
        run: echo "The core suite uses only the Node standard library."
      - name: Run the tests
        run: node --test
      - name: Run serially too (catches timer/ordering coupling)
        run: node --test --test-concurrency=1
      - name: Whitespace check
        run: git diff --check HEAD~1 || true
